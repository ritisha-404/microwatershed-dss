[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microwatershed-dss"
version = "0.1.0"
description = "Microwatershed Decision Support System - terrain assessment from a point location"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "rasterio>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# WhiteboxTools via pip (downloads the WBT binary on first use).
# On NixOS, install the native `whitebox-tools` package instead (see flake.nix).
whitebox = ["whitebox>=2.3"]
test = ["pytest>=7.4"]

[project.scripts]
microwatershed = "microwatershed.main:main"
microwatershed-delineate = "microwatershed.delineate:main"
microwatershed-qgis-export = "microwatershed.qgis_export.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that download data from the internet (deselect with '-m \"not network\"')",
]
